<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="الموقع الشخصي لمحمد قاسم، مطوّر برمجيات متخصص في React وNext.js وأنظمة ERP. تعرّف على مشاريعي ومهاراتي."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="محمد قاسم | مطوّر برمجيات" />
    <meta
      property="og:description"
      content="Mohammed Qassim — Software Developer · React · Next.js · ERP systems"
    />
    <meta property="og:image" content="%PUBLIC_URL%/images/avatar.png" />

    <!-- Apply saved language and theme before first paint (no flash). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var lang = localStorage.getItem("lang");
          if (lang !== "en") lang = "ar";
          root.lang = lang;
          root.dir = lang === "ar" ? "rtl" : "ltr";

          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            root.classList.add("dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#020617");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Nunito:wght@200..1000&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
    />

    <title>محمد قاسم | مطوّر برمجيات</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  </body>
</html>
